# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - prototypeAihelper

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          npm ci
          npm run build --if-present

      - name: Prepare Next.js standalone package
        run: |
          mkdir -p release
          cp -a .next/standalone/. release/
          mkdir -p release/.next/static
          cp -a .next/static/. release/.next/static/
          cp -a public release/public
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' > release/.deployment

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: site

      - name: Flatten package if nested
        run: |
          if [ -d site/release ] && [ ! -f site/server.js ]; then
            shopt -s dotglob
            mv site/release/* site/
            rmdir site/release
          fi
          ls -la site
          test -f site/server.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_667CC97F7F074B11A6051467FC70AC8A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E2E955F2BCA4D1F9D75FF0840A4E8E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2D9FC425DF9A47CE9F0198800893B4DA }}

      - name: Stop app and set startup
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp stop --name prototypeAihelper --resource-group rg-i-grin
            az webapp config appsettings set --name prototypeAihelper --resource-group rg-i-grin --output none --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false
            az webapp config set --name prototypeAihelper --resource-group rg-i-grin --startup-file "node server.js"

      - name: Zip standalone package
        run: |
          cd site
          zip -r ../site.zip .
          ls -lh ../site.zip

      - name: Deploy zip without waiting on site health
        timeout-minutes: 8
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy --resource-group rg-i-grin --name prototypeAihelper --src-path site.zip --type zip --async false --clean true --track-status false

      - name: Start app
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp start --name prototypeAihelper --resource-group rg-i-grin
